name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Rename
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/mrok.exe mrok-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mrok-windows-x86_64
          path: mrok-windows-x86_64.exe
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build arm64
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/mrok \
            target/x86_64-apple-darwin/release/mrok \
            -output mrok-macos-universal
          chmod +x mrok-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: mrok-macos-universal
          path: mrok-macos-universal
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
